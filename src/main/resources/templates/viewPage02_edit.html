<html>
<head>
<title>Chap14</title>
</head>
<body>
	<div align="center">
		<h3>기존 Member 등록</h3>
		<form action="#" th:action="@{/exam14_01/update}" th:object="${member}"
			method="post">
			<table border="0" cellpadding="10">
				<tr>
					<td>아이디:</td>
					<td><input type="text" th:field="*{id}" readonly/></td>
				</tr>
				<tr>
					<td>이름:</td>
					<td><input type="text" th:field="*{name}" readonly/></td>
				</tr>
				<tr>
					<td>나이:</td>
					<td><input type="text" th:field="*{age}" />
							<span th:if="${#fields.hasErrors('age')}" style="color:red">나이는 숫자로 입력하세요.</span></td>
				</tr>
				<tr>
					<td>이메일:</td>
					<td><input type="text" th:field="*{email}" /></td>
				</tr>

				<tr>
					<td colspan="2"><button type="submit">Update</button></td>
				</tr>
			</table>
		</form>
	</div>
</body>
</html>
